name: iOS build

on:
  push:
    branches: [main]
    paths: ["BigHeadParty/**", "BigHeadParty.xcodeproj/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project BigHeadParty.xcodeproj -scheme BigHeadParty \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee sim.log | grep -E "error:|warning: .*(deprecated|will never be executed)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" sim.log

      - name: Run in the iPhone Simulator and take screenshots
        timeout-minutes: 15
        run: |
          # t SECONDS CMD...: run with a time limit (macOS has no `timeout`)
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          APP=build/sim/Build/Products/Debug-iphonesimulator/BigHeadParty.app
          BUNDLE=com.domqinvestments.bigheadparty
          xcrun simctl list runtimes | grep -i ios
          DEVTYPE=$(xcrun simctl list devicetypes | grep -E "^iPhone 1[5-7] \(" | head -1 | sed -E 's/.*\((com[^)]+)\).*/\1/')
          RUNTIME=$(xcrun simctl list runtimes | grep -E "^iOS .*com.apple" | tail -1 | sed -E 's/.* - (com[^ ]+).*/\1/')
          echo "device type: $DEVTYPE  runtime: $RUNTIME"
          UDID=$(xcrun simctl create bhp "$DEVTYPE" "$RUNTIME")
          echo "created $UDID"
          t 240 xcrun simctl boot "$UDID" || echo "boot returned $?"
          t 300 xcrun simctl bootstatus "$UDID" -b || echo "bootstatus returned $?"
          echo "booted"
          t 120 xcrun simctl install "$UDID" "$APP"
          echo "installed"
          mkdir -p shots
          # A test portrait for the photo -> 3D head pipeline (downloaded, not stored in the repo).
          curl -sSL -o "$PWD/test-face.png" https://storage.googleapis.com/mediapipe-assets/business-person.png || true
          shot() { t 30 xcrun simctl io "$UDID" screenshot "shots/$1.png" >/dev/null 2>&1 || echo "screenshot $1 failed"; }
          run() {  # run NAME SECONDS ARGS...
            local name=$1 wait=$2; shift 2
            echo "== $name"
            t 20 xcrun simctl terminate "$UDID" $BUNDLE >/dev/null 2>&1 || true
            t 60 xcrun simctl launch "$UDID" $BUNDLE "$@" || echo "launch failed for $name"
            sleep "$wait"; shot "$name"
            if list=$(t 40 xcrun simctl spawn "$UDID" launchctl list); then
              echo "$list" | grep -q "$BUNDLE" || echo "::error::App is not running after $name"
            else
              echo "(running check timed out after $name)"
            fi
          }
          run 01-intro-demo 14
          run 02-home 8 -hasSeenIntro YES
          run 03-face-studio 22 -hasSeenIntro YES -studioTestImage "$PWD/test-face.png"
          run 04-pie-q-test 12 -hasSeenIntro YES -demoGame pieShow
          run 05-slap-champs 9 -hasSeenIntro YES -demoGame slap
          run 06-dunk-tank 9 -hasSeenIntro YES -demoGame dunk
          run 07-whack-a-head 9 -hasSeenIntro YES -demoGame whack
          run 08-bobble-boxing 9 -hasSeenIntro YES -demoGame boxing
          run 09-slap-real-heads 9 -hasSeenIntro YES -headSize real -demoGame slap
          cp debug-* shots/ 2>/dev/null || true
          ls -la shots
          find ~/Library/Logs/DiagnosticReports -name "BigHeadParty*" -newer "$APP" -exec cp {} shots/ \; 2>/dev/null || true
          if ls shots | grep -qiE "\.ips$|\.crash$"; then echo "::error::Crash report found"; else echo "No crash reports"; fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project BigHeadParty.xcodeproj -scheme BigHeadParty \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/BigHeadParty.app Payload/
          zip -qr BigHeadParty-unsigned.ipa Payload

      - name: Upload IPA (re-sign with Sideloadly/AltStore to install)
        uses: actions/upload-artifact@v4
        with:
          name: BigHeadParty-unsigned-ipa
          path: BigHeadParty-unsigned.ipa

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
