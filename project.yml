# Fallback: `brew install xcodegen && xcodegen` regenerates BigHeadParty.xcodeproj
name: BigHeadParty
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  BigHeadParty:
    type: application
    platform: iOS
    sources: [BigHeadParty]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bigheadparty
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Big Head Party
        INFOPLIST_KEY_NSCameraUsageDescription: Snap a photo of a friend so Big Head Party can turn their face into a 3D character. Photos are processed on your device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save screenshots of your pie-splattered friends.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
